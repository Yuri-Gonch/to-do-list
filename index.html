<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Simple Board</h1>

        <div class="add-card">
            <input type="text" id="cardInput" placeholder="Enter new text">
            <button id="addButton">Add Card</button>
        </div>

        <div class="board">
            
            <div class="list" id="list1">
                <h2>To Do</h2>
                <div class="card" draggable="true" id="card1">Wash Dishes</div>
                <div class="card" draggable="true" id="card2">Take Pills</div>
            </div>

            <div class="list" id="list2">
                <h2>In Progress</h2>
                <div class="card" draggable="true" id="card3">Clean Room</div>
            </div>

            <div class="list" id="list3">
                <h2>Done</h2>
                <div class="card" draggable="true" id="card4">Do Homework</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
